[general]
import = ["~/.cache/wal/colors-alacritty.toml"]

[window]
padding.x = 10
padding.y = 10
decorations = "Buttonless"
opacity = 0.9

[font]
normal.family = "JetBrainsMono Nerd Font"
normal.style = "Regular"
size = 14

[colors.primary]
background = "#1a1b26"
foreground = "#a9b1d6"

[colors.normal]
black = "#323440"
red = "#f7768e"
green = "#9ece6a"
yellow = "#e0af68"
blue = "#7aa2f7"
magenta = "#ad8ee6"
cyan = "#449dab"
white = "#787c99"
