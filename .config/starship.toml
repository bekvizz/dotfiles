[cmd_duration]
format = "[$duration](fg:3)"

[directory]
format = "[$path](bg:5 fg:0)"
truncation_length = 2
truncation_symbol = "…/"

[character]
success_symbol = "[](bold 5)"
error_symbol = "[✗](bold 1)"
disabled = false
